name: RFC (design proposal)
description: Propose a change to the public API, policy language, event schema or governance
title: "rfc: "
labels: ["type/rfc", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: RFCs stay open for comments for at least 7 days. Accepted RFCs become ADRs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation and user impact
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Detailed design
    validations:
      required: true
  - type: textarea
    id: compat
    attributes:
      label: Compatibility and migration
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
