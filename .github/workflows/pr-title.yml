name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      # Does not check out or run PR code, so pull_request_target is safe here.
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            deps
            docs
            test
            refactor
            build
            ci
            chore
            revert
          scopes: |
            policy
            core
            sdk
            hub
            cli
            dashboard
            mcp
            notifiers
            spec
            python
            packs
            docs
            ci
            deps
            release
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: 'Start the summary with a lowercase letter, for example "feat(policy): add matches operator".'
